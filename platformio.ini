[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -DZIGBEE_MODE_ED
    -DCONFIG_ZB_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    olikraus/U8g2
    milesburton/DallasTemperature

; Produktivgeraet: ESP32-C6-Zero, 8 MB Flash, OTA-faehig
[env:esp32-c6]
board_build.partitions = partitions_zigbee_web.csv

; Dev-/Testboard: ESP32-C6-MINI-1, nur 4 MB Flash, keine OTA-Partition
; Bauen/Flashen mit: pio run -e esp32-c6-4mb -t upload
[env:esp32-c6-4mb]
board_build.partitions = partitions_zigbee_4mb.csv
board_upload.flash_size = 4MB
